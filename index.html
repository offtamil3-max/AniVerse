<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniVerse</title>
  <style>html,body{margin:0;background:#09090e;color:#fff;font-family:system-ui,sans-serif}#loading{padding:40px;text-align:center}</style>
</head>
<body>
  <div id="loading">⚡ Loading AniVerse…</div>
  <script>
  (async()=>{
    try{
      const url='./AniVerse%20-%20Anime%20Streaming%20Platform%20(1).html?v='+Date.now();
      let html=await fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Site file failed to load');return r.text()});

      const marker='const animeData = [';
      const s=html.indexOf(marker);
      if(s>=0){
        const e=html.indexOf('];',s);
        if(e>=0){
          let part=html.slice(s,e);
          part=part.replace(/}\s*,?\s*\{/g,'},\n  {').replace(/},\s*,/g,'},');

          // Home page should contain ONLY anime added through Admin.
          // The original template entries use ids 1-10; Admin entries use Date.now() ids.
          part=part.replace(/\{\s*id:\s*(?:[1-9]|10),[\s\S]*?\n\s*\},?/g,'');
          part=part.replace(/^\s*,/,'').replace(/,\s*$/,'');

          html=html.slice(0,s)+marker+'\n'+part+'\n'+html.slice(e);
        }
      }

      // Make the hero use the first anime added through Admin instead of the demo anime.
      const heroScript=`<script>
      (function(){
        try{
          const a=animeData[0];
          if(!a)return;
          const hero=document.getElementById('heroSection');
          const title=hero.querySelector('h1');
          const meta=hero.querySelector('.flex.flex-wrap.items-center.gap-4');
          const desc=hero.querySelector('p.text-slate-300');
          const watch=hero.querySelector('.btn-primary');
          const list=hero.querySelector('.btn-secondary');
          if(title){title.textContent=a.title;}
          if(meta){meta.innerHTML='<span class="text-amber-400 font-bold flex items-center gap-1">★ '+a.rating+'</span><span>•</span><span>'+a.year+'</span><span>•</span><span class="text-purple-400 font-semibold">'+a.eps+' Episodes</span><span>•</span><span class="bg-white/10 px-2 py-0.5 rounded text-xs">'+a.genre.join(', ')+'</span>';}
          if(desc)desc.textContent=a.desc||'';
          if(watch)watch.setAttribute('onclick','openAnimeModal('+a.id+', true)');
          if(list)list.setAttribute('onclick','toggleBookmark('+a.id+', this)');
          const bg=document.getElementById('heroBgContainer');
          if(bg && typeof generateAnimeSVG==='function')bg.innerHTML='<img src="'+generateAnimeSVG(a.title,a.color,a.secondaryColor,a.badge)+'" class="w-full h-full object-cover" alt="'+a.title+'">';
        }catch(e){}
      })();
      <\/script>`;
      html=html.replace('</body>',heroScript+'</body>');

      document.open();
      document.write(html);
      document.close();
    }catch(e){
      document.body.innerHTML='<div style="padding:40px;text-align:center"><h2>AniVerse could not load</h2><p>'+e.message+'</p><button onclick="location.reload()">Retry</button></div>'
    }
  })();
  </script>
</body>
</html>
