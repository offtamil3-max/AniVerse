<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AniVerse Admin</title><style>body{font-family:system-ui;background:#09090e;color:#eee;max-width:760px;margin:auto;padding:24px}input,textarea,select{width:100%;box-sizing:border-box;margin:6px 0 14px;padding:12px;border-radius:8px;border:1px solid #333;background:#15151f;color:#fff}button{padding:12px 18px;border:0;border-radius:8px;background:#7c3aed;color:#fff;font-weight:700;margin:4px 8px 10px 0}.card{background:#12121a;padding:20px;border-radius:14px;margin-bottom:18px}small{color:#aaa}.ok{color:#4ade80}.err{color:#fb7185}.preview{display:flex;gap:14px}.preview img{width:110px;height:155px;object-fit:cover;border-radius:10px}</style></head><body><h1>⚡ AniVerse Admin</h1><p><small>Free anime metadata lookup + GitHub publishing.</small></p><div class="card"><h2>🔎 Auto-Fetch Anime</h2><input id="search" placeholder="Enter anime name — e.g. One Piece"><button onclick="lookup()">✨ Fetch Details</button><p id="lookupStatus"></p><div id="preview"></div></div><div class="card"><h2>➕ Anime Details</h2><label>Title</label><input id="title"><label>Rating</label><input id="rating" type="number" step="0.1"><label>Year</label><input id="year" type="number"><label>Episodes</label><input id="eps" type="number"><label>Genres</label><input id="genre"><label>Poster image URL</label><input id="poster"><label>Description</label><textarea id="desc" rows="5"></textarea><label>Badge</label><select id="badge"><option value="new">NEW</option><option value="hd">HD</option><option value="sub">SUB</option></select></div><div class="card"><h2>🔐 GitHub</h2><input id="token" type="password" placeholder="Fine-grained GitHub token"><small>Token is saved only on this device/browser. Never share it with anyone.</small><br><button onclick="saveToken()">💾 Save Token</button><button onclick="publish()">🚀 Publish to GitHub</button><button onclick="clearForm()">Clear</button><p id="status"></p></div><script>const owner='offtamil3-max',repo='AniVerse',file='AniVerse - Anime Streaming Platform (1).html';const $=id=>document.getElementById(id);function msg(x,c=''){ $('status').className=c;$('status').textContent=x }function saveToken(){const t=$('token').value.trim();if(!t)return msg('Enter a token','err');localStorage.setItem('gh_token',t);msg('✅ Token saved on this device. You do not need to save it again.','ok')}function loadToken(){const t=localStorage.getItem('gh_token');if(t)$('token').value=t}function fill(a){$('title').value=a.title||'';$('rating').value=a.rating??'';$('year').value=a.year||'';$('eps').value=a.eps||'';$('genre').value=(a.genres||[]).join(', ');$('poster').value=a.poster||'';$('desc').value=a.desc||'';$('preview').innerHTML='<div class="preview">'+(a.poster?'<img src="'+a.poster+'">':'')+'<div><b>'+esc(a.title)+'</b><p>⭐ '+(a.rating??'N/A')+' · '+(a.year||'Unknown')+' · '+(a.eps||'?')+' eps</p><small>'+esc((a.genres||[]).join(', '))+'</small></div></div>'}async function lookup(){const q=$('search').value.trim();if(!q){$('lookupStatus').textContent='Enter an anime name first.';return}$('lookupStatus').textContent='🔎 Searching…';$('preview').innerHTML='';try{let a=null;for(let attempt=0;attempt<2&&!a;attempt++){try{const r=await fetch('https://api.jikan.moe/v4/anime?q='+encodeURIComponent(q)+'&limit=5',{cache:'no-store'});if(r.ok){const j=await r.json();const x=j.data?.[0];if(x)a={title:x.title||x.title_english||q,rating:x.score,year:x.year||x.aired?.prop?.from?.year,eps:x.episodes,genres:(x.genres||[]).map(g=>g.name.toLowerCase()),poster:x.images?.jpg?.large_image_url||x.images?.jpg?.image_url||'',desc:x.synopsis||''}}}catch(e){}if(!a&&attempt===0)await new Promise(r=>setTimeout(r,1200))}if(!a){$('lookupStatus').textContent='🔄 Jikan is busy. Trying backup database…';const query=`query($search:String){Page(perPage:5){media(search:$search,type:ANIME,sort:SEARCH_MATCH){title{romaji english native}averageScore startDate{year}episodes genres coverImage{large medium}description}}}`;const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables:{search:q}})});if(!r.ok)throw Error('Anime databases are temporarily busy. Try again in a few seconds.');const j=await r.json();const x=j.data?.Page?.media?.[0];if(!x)throw Error('Anime not found');a={title:x.title?.english||x.title?.romaji||x.title?.native||q,rating:x.averageScore?x.averageScore/10:null,year:x.startDate?.year,eps:x.episodes,genres:(x.genres||[]).map(g=>g.toLowerCase()),poster:x.coverImage?.large||x.coverImage?.medium||'',desc:(x.description||'').replace(/<[^>]*>/g,'')}}fill(a);$('lookupStatus').textContent='✅ Details loaded. Check them before publishing.'}catch(e){$('lookupStatus').textContent='❌ '+e.message}}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function clearForm(){['search','title','rating','year','eps','genre','poster','desc'].forEach(id=>$(id).value='');$('preview').innerHTML='';$('lookupStatus').textContent=''}async function publish(){const token=localStorage.getItem('gh_token')||$('token').value.trim();if(!token)return msg('Save a GitHub token first.','err');const title=$('title').value.trim();if(!title)return msg('Fetch or enter a title first.','err');msg('Reading current AniVerse…');const url='https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+encodeURIComponent(file);try{const r=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub read failed: '+r.status);const j=await r.json();let text=decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));const marker='const animeData = [';const start=text.indexOf(marker);if(start<0)throw Error('animeData section not found');const end=text.indexOf('\n];',start);if(end<0)throw Error('animeData end not found');const anime={id:Date.now(),title,rating:Number($('rating').value)||0,year:Number($('year').value)||0,eps:Number($('eps').value)||0,genre:$('genre').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),badge:$('badge').value,color:'#7c3aed',secondaryColor:'#ec4899',desc:$('desc').value.trim()};if($('poster').value.trim())anime.poster=$('poster').value.trim();const arr=text.slice(start+marker.length,end).trim();const obj=(arr?arr+',\n':'\n')+'  '+JSON.stringify(anime,null,2).replace(/^/gm,'  ');text=text.slice(0,start+marker.length)+'\n'+obj+'\n'+text.slice(end);const put=await fetch(url,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Add anime: '+title,content:btoa(unescape(encodeURIComponent(text))),sha:j.sha})});if(!put.ok){const e=await put.json().catch(()=>({}));throw Error(e.message||'GitHub update failed: '+put.status)}msg('✅ Published! Website will update shortly.','ok')}catch(e){msg('❌ '+e.message,'err')}}loadToken();</script></body></html>
