<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AniVerse Admin</title><style>body{font-family:system-ui;background:#09090e;color:#eee;max-width:760px;margin:auto;padding:24px}input,textarea,select{width:100%;box-sizing:border-box;margin:6px 0 14px;padding:12px;border-radius:8px;border:1px solid #333;background:#15151f;color:#fff}button{padding:12px 18px;border:0;border-radius:8px;background:#7c3aed;color:#fff;font-weight:700;margin-right:8px}.card{background:#12121a;padding:20px;border-radius:14px;margin-bottom:18px}small{color:#aaa}.ok{color:#4ade80}.err{color:#fb7185}</style></head><body><h1>⚡ AniVerse Admin</h1><p><small>This dashboard publishes anime metadata by committing changes to your GitHub repository.</small></p><div class="card"><h2>GitHub access</h2><label>Fine-grained GitHub token</label><input id="token" type="password" placeholder="github_pat_…"><small>Use a fine-grained token limited to this repository with Contents: Read and write. Do not share it.</small><button onclick="saveToken()">Save for this session</button></div><div class="card"><h2>➕ Add Anime</h2><label>Title</label><input id="title"><label>Rating</label><input id="rating" type="number" step="0.1" value="8.5"><label>Year</label><input id="year" type="number" value="2026"><label>Episodes</label><input id="eps" type="number" value="12"><label>Genres (comma separated)</label><input id="genre" placeholder="action, fantasy"><label>Poster image URL</label><input id="poster" placeholder="https://…"><label>Description</label><textarea id="desc" rows="4"></textarea><label>Badge</label><select id="badge"><option value="new">NEW</option><option value="hd">HD</option><option value="sub">SUB</option></select><button onclick="publish()">🚀 Publish to GitHub</button><button onclick="clearForm()">Clear</button><p id="status"></p></div><script>const owner='offtamil3-max',repo='AniVerse',file='AniVerse - Anime Streaming Platform (1).html';function saveToken(){const t=document.getElementById('token').value.trim();if(!t)return msg('Enter a token','err');sessionStorage.setItem('gh_token',t);msg('Token saved only for this browser session.','ok')}function msg(x,c=''){document.getElementById('status').className=c;document.getElementById('status').textContent=x}function clearForm(){document.querySelectorAll('input:not(#token),textarea').forEach(e=>e.value='');document.getElementById('rating').value='8.5';document.getElementById('year').value='2026';document.getElementById('eps').value='12'}async function publish(){const token=sessionStorage.getItem('gh_token')||document.getElementById('token').value.trim();if(!token)return msg('Save a GitHub token first.','err');const title=document.getElementById('title').value.trim();if(!title)return msg('Title is required.','err');msg('Reading current site…');const url=`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(file)}`;try{const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub read failed: '+r.status);const j=await r.json();let text=atob(j.content.replace(/\n/g,''));const anime={id:Date.now(),title,rating:Number(document.getElementById('rating').value)||0,year:Number(document.getElementById('year').value)||2026,eps:Number(document.getElementById('eps').value)||1,genre:document.getElementById('genre').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),badge:document.getElementById('badge').value,color:'#7c3aed',secondaryColor:'#ec4899',desc:document.getElementById('desc').value.trim()};if(document.getElementById('poster').value.trim())anime.poster=document.getElementById('poster').value.trim();const marker='const animeData = [';const start=text.indexOf(marker);if(start<0)throw new Error('animeData section not found');const end=text.indexOf('\n];',start);if(end<0)throw new Error('animeData end not found');const arr=text.slice(start+marker.length,end).trim();const newObj='  '+JSON.stringify(anime,null,2).replace(/^/gm,'  ')+',';text=text.slice(0,start+marker.length)+'\n'+arr+'\n'+newObj+text.slice(end);const put=await fetch(url,{method:'PUT',headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:`Add anime: ${title}`,content:btoa(unescape(encodeURIComponent(text))),sha:j.sha})});if(!put.ok){const e=await put.json().catch(()=>({}));throw new Error(e.message||'GitHub update failed: '+put.status)}msg('✅ Published! GitHub Pages will update shortly.','ok');clearForm()}catch(e){msg('❌ '+e.message,'err')}}</script></body></html>
